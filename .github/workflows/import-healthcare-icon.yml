name: Import healthcare illustration
on:
  push:
    paths: ['.github/workflows/import-healthcare-icon.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify original user illustration
        run: |
          set -euo pipefail
          mkdir -p assets/hero
          curl -fLSs --retry 3 'https://d2ol7oe51mr4n9.cloudfront.net/user_3MJElhErczOSvirV6TlCxTMn1ir/ccd8a612-54c7-4a37-b16b-0f4fb0b4125a.png' -o assets/hero/medical-monitor.png
          echo '244d4f5697fcf698acb6447bf07c5f98429ba376d869fcba839d346a85e1163a  assets/hero/medical-monitor.png' | sha256sum -c -
      - name: Commit image
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/hero/medical-monitor.png
          if ! git diff --cached --quiet; then
            git commit -m "Add healthcare hero illustration in place of turtle"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
